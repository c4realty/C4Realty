<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>C4 Realty · Administración</title>
<link rel="icon" href="../img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=Inter+Tight:wght@700&family=Fraunces:wght@700&family=Playfair+Display:wght@800;900&family=DM+Serif+Display&display=swap">
<style>
:root{
  --bg:#0a1322;--panel:#0f1c33;--card:#132342;--card-2:#1a2f55;
  --fg:#eaf0fa;--muted:#9fb0c8;--faint:#6f82a0;--line:#22365a;
  --accent:#f2b84b;--accent-ink:#1a1200;--sky:#6cb6ff;
  --good:#3fbf7f;--warn:#fab219;--crit:#e05050;
  --st-borrador:#6f82a0;--st-disponible:#3987e5;--st-reservada:#c98500;--st-en_negociacion:#d55181;--st-vendida:#199e70;--st-alquilada:#9085e9;--st-retirada:#5a6780;
  --font-display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14.5px;line-height:1.5;margin:0}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15}
h1{font-size:1.45rem;font-weight:800}h2{font-size:1.05rem;font-weight:700}h3{font-size:.95rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.faint{color:var(--faint)}
.hide{display:none!important}

/* entrada */
.login{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.login-box{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;display:grid;gap:16px}
.login-box img{height:46px;justify-self:start}
.tabs{display:flex;gap:4px;background:var(--panel);border-radius:10px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;padding:8px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:700}
.tabs button.on{background:var(--card-2);color:var(--fg)}
.msg{font-size:.88rem;border-radius:10px;padding:10px 12px;background:rgba(108,182,255,.1);border:1px solid rgba(108,182,255,.3)}
.msg.err{background:rgba(224,80,80,.12);border-color:rgba(224,80,80,.4)}
.msg.ok{background:rgba(63,191,127,.12);border-color:rgba(63,191,127,.4)}

/* formularios */
.f{display:grid;gap:5px;min-width:0}
.f label{font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
.f textarea{min-height:80px;resize:vertical}
.f.chk{display:flex;align-items:center;gap:8px}.f.chk input{width:auto}.f.chk label{text-transform:none;letter-spacing:0;font-size:.9rem;color:var(--fg);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:620px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;font-weight:700;cursor:pointer;font-size:.86rem;white-space:nowrap}
.btn:hover{border-color:var(--sky)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:.8rem;border-radius:8px}
.btn.del{border-color:rgba(224,80,80,.5);color:#ff9b9b}
.btn:disabled{opacity:.5;cursor:default}

/* estructura */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
aside.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand img{height:34px}
.brand small{display:block;font-size:.68rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
nav.menu{display:grid;gap:2px}
nav.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600;text-align:left}
nav.menu button:hover{background:var(--card);color:var(--fg)}
nav.menu button.on{background:var(--card-2);color:var(--fg)}
nav.menu .ico{width:18px;text-align:center}
nav.menu .badge{margin-left:auto;background:var(--crit);color:#fff;border-radius:999px;font-size:.7rem;padding:1px 7px;font-weight:700}
.me{margin-top:auto;display:grid;gap:8px;padding:10px 6px 0;border-top:1px solid var(--line)}
.me b{display:block}.me small{color:var(--muted)}
.me .row{display:flex;gap:6px;flex-wrap:wrap}
main{min-width:0;padding:20px max(20px,env(safe-area-inset-right)) 70px max(20px,env(safe-area-inset-left))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top .sub{color:var(--muted);font-size:.88rem;margin-top:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input,.tools select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0}
.tools input{width:220px}
.mbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside.side{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  aside.side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
  .mbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px}
  .mbar img{height:28px}
  main{padding:16px 16px 70px}
  .tools input{width:100%}
  .tools{width:100%}
}

/* tarjetas */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px;min-width:0}
.kpi small{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi b{font-family:var(--font-display);font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;overflow-wrap:anywhere}
.kpi span{font-size:.8rem;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.cols{grid-template-columns:1fr}}

/* tablas */
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--panel);position:sticky;top:0;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:rgba(108,182,255,.06)}
td.r,th.r{text-align:right}
.thumb{width:54px;height:40px;border-radius:7px;object-fit:cover;background:var(--panel);display:block}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:.76rem;font-weight:700;white-space:nowrap;background:var(--panel);border:1px solid var(--line)}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.sel-estado{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:.82rem;font-weight:700}
.list{display:grid;gap:8px}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.empty{color:var(--muted);padding:14px 0;font-size:.9rem}
.bar{height:8px;border-radius:99px;background:var(--panel);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* embudo */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.kcol h3{display:flex;justify-content:space-between;font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:2px 4px}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;cursor:pointer}
.kcard:hover{border-color:var(--sky)}
.kcard small{color:var(--muted)}

/* panel lateral */
.drawer{position:fixed;inset:0;z-index:60;display:none}
.drawer.open{display:block}
.drawer .shade{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.drawer .box{position:absolute;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);border-left:1px solid var(--line);overflow:auto;padding:20px;display:grid;gap:16px;align-content:start}
.drawer .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:sticky;top:-20px;background:var(--bg);padding:8px 0;z-index:2}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.gal img,.gal video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;background:var(--panel)}
.tl{display:grid;gap:10px}
.tl .it{border-left:2px solid var(--line);padding:0 0 0 12px}
.tl .it small{color:var(--muted);display:block}
.docs{display:grid;gap:6px}
.docs label{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.code{font-family:ui-monospace,Consolas,monospace;font-size:1.3rem;font-weight:700;letter-spacing:.1em;background:var(--panel);border:1px dashed var(--accent);border-radius:10px;padding:10px 14px;display:inline-block}
.swatches{display:flex;gap:6px;margin:10px 0}
.swatches i{width:30px;height:30px;border-radius:8px;border:1px solid var(--line)}
.tpl{display:grid;gap:8px}
.tpl .prev{border-radius:12px;padding:14px;border:1px solid var(--line);min-height:120px;display:grid;gap:8px;align-content:start}
.perm td{text-align:center}.perm td:first-child{text-align:left}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:10px 16px;z-index:90;font-weight:600;max-width:calc(100% - 32px)}
.toast.err{border-color:var(--crit)}
.spin{opacity:.6;pointer-events:none}

/* volantes */
.vl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:16px;align-items:start}
@media (max-width:900px){.vl{grid-template-columns:1fr}}
.vl-form{display:grid;gap:12px}
.vl-prev{position:sticky;top:12px;display:grid;gap:8px;justify-items:center}
.vl-prev canvas{width:100%;max-height:78vh;object-fit:contain;border-radius:12px;background:#000;touch-action:none;cursor:grab}
.vl-thumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.vl-thumbs button{flex:none;width:64px;height:84px;border-radius:8px;border:2px solid transparent;padding:0;overflow:hidden;cursor:pointer;background:var(--panel)}
.vl-thumbs button.on{border-color:var(--accent)}
.vl-thumbs img{width:100%;height:100%;object-fit:cover;display:block}

/* hot list y difusión */
.hl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.hlc{display:grid;gap:10px;padding:12px}
.hl-img{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--panel)}
.hl-img img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.hl-b{position:absolute;left:8px;top:8px;background:#e8463a;color:#fff;font-weight:800;font-size:.85rem;border-radius:999px;padding:4px 10px}
.hl-t{display:grid;gap:3px}.hl-p{display:flex;gap:8px;align-items:baseline;font-size:1.15rem;font-weight:800}.hl-p s{font-size:.85rem;font-weight:600}
.dl{display:grid;gap:6px;max-height:420px;overflow:auto}
.dli{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;font-size:.9rem}
.dli img{width:40px;height:52px;object-fit:cover;border-radius:6px;flex:none}
.dli input{width:18px;height:18px;flex:none}
</style>
</head>
<body>

<!-- ENTRADA -->
<div class="login hide" id="v-login">
  <div class="login-box">
    <img src="../img/logo.png" alt="C4 Realty">
    <div>
      <h1>Administración</h1>
      <p class="muted" style="margin-top:4px">Entra con tu correo y tu clave.</p>
    </div>
    <div class="tabs"><button class="on" data-lt="entrar">Entrar</button><button data-lt="activar">Activar mi cuenta</button></div>
    <form id="f-entrar" class="tl" style="gap:12px">
      <div class="f"><label for="le">Correo</label><input id="le" type="email" autocomplete="username" required></div>
      <div class="f"><label for="lc">Clave</label><input id="lc" type="password" autocomplete="current-password" required></div>
      <button class="btn pri" type="submit">Entrar</button>
    </form>
    <form id="f-activar" class="tl hide" style="gap:12px">
      <p class="muted" style="font-size:.9rem">Para activar tu cuenta necesitas el código de activación que te da el administrador. Aquí creas tu propia clave.</p>
      <div class="f"><label for="ae">Correo</label><input id="ae" type="email" autocomplete="username" required></div>
      <div class="f"><label for="ac">Código de activación</label><input id="ac" placeholder="XXXX-XXXX" autocomplete="one-time-code"></div>
      <div class="f"><label for="ap">Crea tu clave</label><input id="ap" type="password" autocomplete="new-password" placeholder="Mínimo 8, con letras y números"></div>
      <div class="f"><label for="ap2">Repite la clave</label><input id="ap2" type="password" autocomplete="new-password"></div>
      <button class="btn pri" type="submit">Activar y entrar</button>
    </form>
    <div id="l-msg" class="msg hide"></div>
  </div>
</div>

<!-- APP -->
<div class="hide" id="v-app">
  <div class="mbar"><button class="btn sm" id="m-open" aria-label="Abrir menú">☰</button><img src="../img/logo.png" alt="C4 Realty"><b id="m-title"></b></div>
  <div class="app">
    <aside class="side" id="side">
      <div class="brand" style="display:grid;gap:4px"><img src="../img/logo.png" alt="C4 Realty"><small>Administración</small></div>
      <nav class="menu" id="menu"></nav>
      <div class="me">
        <div><b id="me-n"></b><small id="me-r"></small></div>
        <div class="row"><button class="btn sm" id="b-clave">Cambiar clave</button><button class="btn sm" id="b-salir">Salir</button></div>
        <a class="faint" href="../" style="font-size:.8rem">Ver la página pública ↗</a>
      </div>
    </aside>
    <main id="main"></main>
  </div>
</div>

<div class="drawer" id="drawer"><div class="shade" data-close></div><div class="box" id="dbox"></div></div>

<script>
/* Dirección del puente (Cloudflare Worker) */
const API = "https://c4realty-api.c4realty0.workers.dev";

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => n == null || n === "" ? "—" : "$" + Number(n).toLocaleString("en-US", { maximumFractionDigits: 0 });
const fecha = s => { if (!s) return "—"; const d = new Date(s.replace(" ", "T") + (s.length <= 19 ? "Z" : "")); return isNaN(d) ? s : d.toLocaleString("es-PA", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }); };
const dia = s => s ? new Date(s.replace(" ", "T") + "Z").toLocaleDateString("es-PA", { day: "2-digit", month: "short", year: "numeric" }) : "—";
const MEDIA = "../";
const img = r => r ? (/^https?:/.test(r) ? r : /^(img\/p\/|docs\/planos\/|videos\/aguacatal-)/.test(r) ? MEDIA + r : "../" + r) : "";
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch { } } };

const EST_P = { borrador: "Borrador", disponible: "Disponible", reservada: "Reservada", en_negociacion: "En negociación", vendida: "Vendida", alquilada: "Alquilada", retirada: "Retirada" };
const CAT = { casa: "Casa", terreno: "Terreno", finca: "Finca", alquiler: "Alquiler", local: "Local", apartamento: "Apartamento" };
const EST_C = { nuevo: "Nuevo", contactado: "Contactado", en_proceso: "En proceso", cliente: "Cliente", perdido: "Perdido", descartado: "Descartado" };
const ORIG = { web_cotizar: "Página · Cotizar", web_contacto: "Página · Contacto", web: "Página", whatsapp: "WhatsApp", instagram: "Instagram", referido: "Referido", visita: "Visita", otro: "Otro" };
const ETAPAS = { cotizacion: "Cotización", recorrido: "Recorrido", apartado: "Apartado", documentacion: "Documentación", aprobacion: "Aprobación", contrato: "Contrato", abonos: "Abonos", entregado: "Entregado", perdido: "Perdido" };
const CITA_T = { recorrido: "Recorrido", llamada: "Llamada", firma: "Firma", entrega: "Entrega", reunion: "Reunión" };
const CITA_E = { programada: "Programada", realizada: "Realizada", cancelada: "Cancelada", no_asistio: "No asistió" };
const INTER = { formulario: "Formulario web", whatsapp: "WhatsApp", llamada: "Llamada", correo: "Correo", visita: "Visita", nota: "Nota", cambio_etapa: "Cambio de etapa" };
const INGRESO = { asalariado: "Asalariado", independiente: "Independiente", jubilado: "Jubilado", otro: "Otro" };
const MODS = { propiedades: "Propiedades", medios: "Fotos y videos", clientes: "Clientes", negocios: "Negocios", citas: "Citas", usuarios: "Usuarios", configuracion: "Configuración", plantillas: "Diseño", reportes: "Reportes", bitacora: "Bitácora" };
// Lista de documentos tal como aparece en la página pública (sección Cotizar)
const DOCS = {
  asalariado: ["Estatus permanente en tu trabajo", "Mínimo 1 año de trabajo (hay excepciones; consultamos tu caso)", "Cédula de identidad personal", "Talonario o comprobante de pago quincenal", "Ficha de la CSS (te llega por correo)", "Carta de trabajo"],
  independiente: ["Declaración de renta o estados financieros de mínimo 2 años", "Movimiento bancario de mínimo 6 meses", "Cartas de referencias comerciales", "Abono entre 10 % y 20 %, normalmente en varios pagos durante la construcción"]
};

let TOK = store.get("c4_tok"), YO = null, VISTA = store.get("c4_vista") || "resumen";
const C = { propiedades: null, clientes: null, usuarios: null };

function toast(t, bad) { const d = document.createElement("div"); d.className = "toast" + (bad ? " err" : ""); d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 3200); }
const pill = (txt, color) => `<span class="pill" style="color:${color}"><i></i><span style="color:var(--fg)">${esc(txt)}</span></span>`;
const pillP = e => pill(EST_P[e] || e, `var(--st-${e})`);
const COL_C = { nuevo: "var(--sky)", contactado: "var(--warn)", en_proceso: "var(--accent)", cliente: "var(--good)", perdido: "var(--crit)", descartado: "var(--faint)" };
const pillC = e => pill(EST_C[e] || e, COL_C[e] || "var(--faint)");
const can = (m, a = "ver") => !!(YO && YO.permisos[m] && YO.permisos[m][a]);

async function api(path, opt = {}) {
  const r = await fetch(API + path, { method: opt.method || "GET", headers: { "Content-Type": "application/json", ...(TOK ? { Authorization: "Bearer " + TOK } : {}) }, body: opt.body ? JSON.stringify(opt.body) : undefined });
  let j = null; try { j = await r.json(); } catch { }
  if (r.status === 401 && TOK && !path.startsWith("/auth/")) { salir(true); throw new Error(j?.error || "Sesión vencida"); }
  if (!r.ok) throw new Error(j?.error || "Error " + r.status);
  return j;
}

/* ---------- entrada ---------- */
function lmsg(t, k) { const m = $("#l-msg"); m.className = "msg" + (k ? " " + k : ""); m.textContent = t; m.classList.toggle("hide", !t); }

function campo(c, v) {
  const id = "fld-" + c.k, val = v ?? c.def ?? "";
  if (c.type === "select") return `<div class="f"><label for="${id}">${c.l}</label><select id="${id}" name="${c.k}" ${c.req ? "required" : ""}>${c.blank !== false ? `<option value="">—</option>` : ""}${Object.entries(c.o).map(([k, t]) => `<option value="${esc(k)}" ${String(val) === String(k) ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></div>`;
  if (c.type === "textarea") return `<div class="f" style="grid-column:1/-1"><label for="${id}">${c.l}</label><textarea id="${id}" name="${c.k}">${esc(val)}</textarea></div>`;
  if (c.type === "check") return `<div class="f chk"><input type="checkbox" id="${id}" name="${c.k}" ${+val ? "checked" : ""}><label for="${id}">${c.l}</label></div>`;
  return `<div class="f"><label for="${id}">${c.l}</label><input id="${id}" name="${c.k}" type="${c.type || "text"}" ${c.step ? `step="${c.step}"` : ""} value="${esc(c.type === "datetime-local" && val ? String(val).slice(0, 16).replace(" ", "T") : val)}" ${c.req ? "required" : ""} ${c.ph ? `placeholder="${esc(c.ph)}"` : ""}></div>`;
}
function leer(form, campos) {
  const o = {};
  for (const c of campos) {
    const el = form.elements[c.k]; if (!el) continue;
    if (c.type === "check") o[c.k] = el.checked ? 1 : 0;
    else if (c.type === "number") o[c.k] = el.value === "" ? null : Number(el.value);
    else if (c.type === "datetime-local") o[c.k] = el.value ? el.value.replace("T", " ") + ":00" : null;
    else o[c.k] = el.value === "" ? null : el.value;
  }
  return o;
}

async function fichaPropiedad(id) {

  const kv = (() => { try { return JSON.parse(p.caracteristicas || "[]"); } catch { return []; } })();
  const inc = (() => { try { return JSON.parse(p.incluye || "[]"); } catch { return []; } })();

  abrir(`

    <form id="f-p" class="card"><div class="grid2">${campos.map(c => campo(c, p[c.k])).join("")}</div>
      <div class="grid3" style="margin-top:12px">
        <div class="f"><label>Características (una por línea: nombre: valor)</label><textarea name="caracteristicas">${esc(kv.map(x => Array.isArray(x) ? x.join(": ") : x).join("\n"))}</textarea></div>
        <div class="f"><label>Incluye (una por línea)</label><textarea name="incluye">${esc(inc.join("\n"))}</textarea></div>

const SITIO = (() => { try { return new URL("../", location.href).href; } catch { return "https://c4realty.github.io/C4Realty/"; } })();
const linkProp = p => SITIO + "?p=" + encodeURIComponent(p.codigo);
const vendibleP = p => ["disponible", "reservada", "en_negociacion"].includes(p.estado);
const descP = p => p.precio && p.precio_antes && +p.precio_antes > +p.precio ? Math.round((1 - p.precio / p.precio_antes) * 100) : 0;
const enHot = p => vendibleP(p) && (descP(p) > 0 || +p.destacada === 1);
const hotList = L => L.filter(enHot).sort((a, b) => descP(b) - descP(a) || (+b.destacada) - (+a.destacada) || (a.orden || 0) - (b.orden || 0));
const waNum = t => { let d = String(t || "").replace(/\D/g, ""); if (d.length === 7 || d.length === 8) d = "507" + d; return d.length >= 10 ? d : ""; };
const waUrl = (tel, txt) => { const d = waNum(tel); return (d ? "https://wa.me/" + d : "https://wa.me/") + "?text=" + encodeURIComponent(txt); };
function datosP(p) {
  const kv = (() => { try { return JSON.parse(p.caracteristicas || "[]"); } catch { return []; } })();
  const g = k => (kv.find(x => Array.isArray(x) && x[0] === k) || [])[1];
  return [g("Recámaras") && g("Recámaras") + " rec", g("Baños") && g("Baños") + (g("Baños") === "1" ? " baño" : " baños"), (g("Lote") || g("Lotes")) && "Lote " + (g("Lote") || g("Lotes"))].filter(Boolean).join(" · ");
}
function textoP(p) {
  const d = descP(p), dat = datosP(p);
  const pr = p.precio ? (p.precio_desde ? "Desde " : "") + money(p.precio) + (d ? ` (antes ${money(p.precio_antes)}, −${d} %)` : "") : "Precio: consultar";
  return [`*${p.titulo}${p.zona ? " · " + p.zona : ""}*`, dat, pr, p.etiqueta ? "🔥 " + p.etiqueta : "", "Fotos y detalles: " + linkProp(p)].filter(Boolean).join("\n");
}
async function copiar(t) { try { await navigator.clipboard.writeText(t); toast("Texto copiado"); } catch { toast("No se pudo copiar", 1); } }

function vlCargar(src) {
  const im = new Image(); if (/^https?:/.test(src)) im.crossOrigin = "anonymous";
  im.onload = () => { VL.img = im; VL.ox = 0; VL.oy = 0; VL.zoom = 1; if ($("#vl-zoom")) $("#vl-zoom").value = 1; vlDraw(); };
  im.onerror = () => toast("No se pudo abrir esa imagen", 1);
  im.src = src;
}
function vlDraw() {
  const cv = $("#vl-cv"); if (!cv) return;
  const [W, H] = VL_FMT[VL.fmt]; if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const x = cv.getContext("2d"); x.save(); x.clearRect(0, 0, W, H);
  // fondo
  const bg = x.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, "#1f6fd1"); bg.addColorStop(.55, "#6fb3ef"); bg.addColorStop(1, "#2f6a2a"); x.fillStyle = bg; x.fillRect(0, 0, W, H);
  if (VL.img) {
    const s = Math.max(W / VL.img.width, H / VL.img.height) * VL.zoom, dw = VL.img.width * s, dh = VL.img.height * s;
    x.drawImage(VL.img, (W - dw) / 2 + VL.ox * W, (H - dh) / 2 + VL.oy * H, dw, dh);
  }
  const msg = $("#vl-msg"); if (msg) msg.textContent = VL.img ? `Tamaño final: ${W} × ${H} px` : "Sube una foto para empezar.";
  const t1 = $("#vl-t1").value.trim(), t2 = $("#vl-t2").value.trim(), t3 = $("#vl-t3").value.trim(), t4 = $("#vl-t4").value.trim(), t5 = $("#vl-t5").value.trim();
  const SERIF = '"Playfair Display", Georgia, "Times New Roman", serif', DIG = '"DM Serif Display", Georgia, serif';
  const runs = (t, font) => t.split(/([0-9]+)/).filter(Boolean).map(r => [r, /^[0-9]+$/.test(r) ? font.replace(/^\d+ /, "400 ").replace(SERIF, DIG) : font]);
  const ancho = (t, font) => runs(t, font).reduce((a, [r, f]) => { x.font = f; return a + x.measureText(r).width; }, 0);
  const maxW = W * .9; let fs = W * .15;
  const tit = [t1, t2].filter(Boolean);
  x.font = `900 ${fs}px ${SERIF}`;
  const w1 = () => ancho(tit.join(" "), `900 ${fs}px ${SERIF}`);
  while (tit.length && w1() > maxW && fs > 40) { fs -= 2; x.font = `900 ${fs}px ${SERIF}`; }
  let fs2 = fs * .68; x.font = `800 ${fs2}px ${SERIF}`; while (t3 && x.measureText(t3).width > maxW && fs2 > 30) { fs2 -= 2; x.font = `800 ${fs2}px ${SERIF}`; }
  const pfs = fs * .6, ph = pfs * 1.45;
  const alto = (tit.length ? fs : 0) + (t3 ? fs2 * 1.05 : 0) + 40 + ((t4 || t5) ? ph + 30 : 0);
  const pos = $("#vl-pos").value;
  let y = pos === "arriba" ? H * .095 : pos === "centro" ? (H - alto) / 2 : H - alto - H * .08;
  if ($("#vl-sombra").checked) {
    const y0 = Math.max(0, y - 120), y1 = Math.min(H, y + alto + 140), g = x.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0, "rgba(0,10,25,0)"); g.addColorStop(.3, "rgba(0,10,25,.32)"); g.addColorStop(.7, "rgba(0,10,25,.32)"); g.addColorStop(1, "rgba(0,10,25,0)");
    x.fillStyle = g; x.fillRect(0, y0, W, y1 - y0);
  }
  const oro = (top, h) => { const g = x.createLinearGradient(0, top, 0, top + h); g.addColorStop(0, "#fff3c4"); g.addColorStop(.38, "#f4d27e"); g.addColorStop(.7, "#dca546"); g.addColorStop(1, "#a8731c"); return g; };
  const sombra = (b) => { x.shadowColor = "rgba(0,0,0,.9)"; x.shadowBlur = b; x.shadowOffsetX = 0; x.shadowOffsetY = 4; };
  const sinSombra = () => { x.shadowColor = "transparent"; x.shadowBlur = 0; x.shadowOffsetY = 0; };
  // piezas de texto en una línea, centradas
  const linea = (partes, font, base, top, h) => {
    x.font = font; x.textBaseline = "alphabetic";
    const sp = x.measureText(" ").width, ws = partes.map(p => ancho(p[0], font));
    let cx = (W - (ws.reduce((a, b) => a + b, 0) + sp * (partes.length - 1))) / 2;
    partes.forEach((p, i) => {
      let rx = cx;
      runs(p[0], font).forEach(([r, f]) => {
        x.font = f;
        for (const b of [56, 22]) { sombra(b); x.fillStyle = p[1] ? oro(top, h) : "#fff"; x.fillText(r, rx, base); }
        sinSombra(); x.fillStyle = p[1] ? oro(top, h) : "#fff"; x.fillText(r, rx, base);
        rx += x.measureText(r).width;
      });
      x.font = font; cx += ws[i] + sp;
    });
  };
  x.textAlign = "left";
  if (tit.length) { const parts = []; if (t1) parts.push([t1, 0]); if (t2) parts.push([t2, 1]); linea(parts, `900 ${fs}px ${SERIF}`, y + fs * .8, y, fs * .85); y += fs; }
  if (t3) { linea([[t3, 0]], `800 ${fs2}px ${SERIF}`, y + fs2 * .82, y, fs2); y += fs2 * 1.05; }
  // línea dorada
  y += 18; const lw = Math.min(W * .34, 380), gl = x.createLinearGradient(W / 2 - lw / 2, 0, W / 2 + lw / 2, 0);
  gl.addColorStop(0, "rgba(232,190,100,0)"); gl.addColorStop(.5, "#f0cf7e"); gl.addColorStop(1, "rgba(232,190,100,0)");
  x.fillStyle = gl; x.fillRect(W / 2 - lw / 2, y, lw, Math.max(3, W * .0035)); y += 22;
  // píldora
  if (t4 || t5) {
    x.font = `800 ${pfs}px ${SERIF}`;
    const parts = []; if (t4) parts.push([t4, 0]); if (t5) parts.push([t5, 1]);
    const sp = x.measureText(" ").width, tw = parts.reduce((a, p) => a + ancho(p[0], `800 ${pfs}px ${SERIF}`), 0) + sp * (parts.length - 1);
    const pw = Math.min(W * .92, tw + pfs * 1.5), px = (W - pw) / 2, r = ph / 2;
    const path = () => { x.beginPath(); x.moveTo(px + r, y); x.arcTo(px + pw, y, px + pw, y + ph, r); x.arcTo(px + pw, y + ph, px, y + ph, r); x.arcTo(px, y + ph, px, y, r); x.arcTo(px, y, px + pw, y, r); x.closePath(); };
    sombra(30); path(); const gp = x.createLinearGradient(0, y, 0, y + ph); gp.addColorStop(0, "#1f3f2a"); gp.addColorStop(1, "#0c2216"); x.fillStyle = gp; x.fill(); sinSombra();
    path(); x.lineWidth = Math.max(3, W * .005); x.strokeStyle = oro(y, ph); x.stroke();
    linea(parts, `800 ${pfs}px ${SERIF}`, y + ph / 2 + pfs * .33, y + ph * .2, ph * .6);
  }
  x.restore();
}
